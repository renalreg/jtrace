name: Test and Publish

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          createuser -h localhost -p 5432 -U postgres ukrdc
          JTRACE_DDL=Database/DDL
          echo "Create JTRACE database with script  ${JTRACE_DDL}/JTRACE.DDL"
          psql -h localhost -p 5432 -U postgres -f ${JTRACE_DDL}/JTRACE.DDL
          for s in ${JTRACE_DDL}/*.SQL; do echo "Running script ${s}"; psql -h localhost -p 5432 -U postgres JTRACE -f $s; done

      - name: Test with Maven
        run: mvn --batch-mode --no-transfer-progress test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Package with Maven
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'pull_request' && format('Package-PR-{0}', github.event.pull_request.number) || 'Package' }}
          path: target/*.jar
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Publish to GitHub Packages Apache Maven
        run: mvn --batch-mode --no-transfer-progress -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
